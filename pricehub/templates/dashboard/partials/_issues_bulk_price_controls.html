<!-- 수정가 반영 -->
<div class="control-row">
  <span class="ctrl-label">수정가 반영</span>
  <div class="ctrl-divider"></div>
  <button class="action-btn success" id="saveAllBtn" onclick="approveChecked()">💾 체크된 카드 저장</button>
  <button class="action-btn" onclick="approveAll()">전체 저장</button>
  <div class="ctrl-divider"></div>
  <div style="display:flex;align-items:center;gap:4px;">
    <input type="number" id="dropPctThreshold" value="10" min="1" max="99" step="1"
           style="width:52px;padding:5px 7px;background:var(--bg);
                  border:1px solid var(--border2);border-radius:6px;
                  color:var(--text);font-family:'JetBrains Mono',monospace;
                  font-size:12px;font-weight:700;outline:none;text-align:center;
                  -moz-appearance:textfield;"
           onfocus="this.style.borderColor='var(--accent2)'"
           onblur="this.style.borderColor='var(--border2)'"
           oninput="document.getElementById('approveByPctBtn').textContent='≤'+this.value+'% 일괄 반영'">
    <span style="font-size:11px;color:var(--text-muted);white-space:nowrap;">% 이하만</span>
    <button class="action-btn" id="approveByPctBtn"
            onclick="approveByPct()"
            style="white-space:nowrap;">≤10% 일괄 반영</button>
  </div>
</div>

<!-- 수정가 일괄 변경 -->
<div class="control-row">
  <span class="ctrl-label">수정가 변경</span>
  <div class="ctrl-divider"></div>
  <!-- 이전 판매가 복원 -->
  <button class="action-btn" onclick="bulkFillOldPrice()"
          style="white-space:nowrap;border-color:var(--accent,#7c6af7);color:var(--accent,#7c6af7);"
          title="체크된 카드의 수정가격 입력란에 이전 판매가를 채웁니다">↩ 이전 판매가 유지</button>
  <div class="ctrl-divider"></div>
  <!-- 새 가격으로 덮어쓰기 -->
  <input type="number" id="bulkSetPriceInput"
         placeholder="새 가격 입력" min="0" step="100"
         style="width:130px;padding:5px 9px;background:var(--bg);
                border:1px solid var(--border2);border-radius:6px;
                color:var(--text);font-family:'JetBrains Mono',monospace;
                font-size:13px;font-weight:600;outline:none;-moz-appearance:textfield;"
         onfocus="this.style.borderColor='var(--accent2)'"
         onblur="this.style.borderColor='var(--border2)'"
         onkeydown="if(event.key==='Enter') bulkSetPrice()">
  <button class="action-btn success" onclick="bulkSetPrice()" style="white-space:nowrap;">가격 일괄 적용</button>
  <div class="ctrl-divider"></div>
  <label style="display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;">
    <input type="checkbox" id="bulkSetUnderOnly"
           style="accent-color:var(--accent2);cursor:pointer;width:13px;height:13px;">
    <span style="font-size:12px;color:var(--text-muted);font-weight:600;">판매가 미만만</span>
  </label>
</div>
